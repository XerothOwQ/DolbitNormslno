<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0703">
<title>Шакалилка</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="crt"></div>
<main>
  <header>
    <div class="boot" id="boot"></div>
    <h1 class="logo">ШАКАЛИЛКА<span class="cur">_</span></h1>
    <p class="sub">SHAKAL.EXE v0.2 // VIDEO DEGRADATION TERMINAL</p>
    <p class="status" id="engine">&gt; ДВИЖОК: ожидание</p>
  </header>

  <section class="win" id="pickWin">
    <div class="wt">[ 01 // ФАЙЛ ]</div>
    <label class="btn big">
      <input type="file" id="file" accept="video/*" hidden>
      &gt; ВЫБРАТЬ ВИДЕО
    </label>
    <div id="fileInfo" class="info" hidden></div>
  </section>

  <section class="win">
    <div class="wt">[ 02 // PRESETS ]</div>
    <div class="presets" id="presets"></div>
    <button class="btn small" id="saveCustom">&gt; СОХРАНИТЬ ТЕКУЩЕЕ КАК CUSTOM</button>
  </section>

  <div id="sections"></div>

  <section class="win" id="progressWin" hidden>
    <div class="wt">[ ПРОЦЕСС ]</div>
    <div id="stage" class="info">…</div>
    <pre class="ascii" id="bar"></pre>
    <div id="eta" class="info dim"></div>
    <button id="cancel" class="btn small">&gt; ОТМЕНА</button>
  </section>

  <section class="win" id="resultWin" hidden>
    <div class="wt">[ РЕЗУЛЬТАТ ]</div>
    <video id="result" controls playsinline loop></video>
    <div id="resultInfo" class="info dim"></div>
    <a id="download" class="btn big" download>&gt; СКАЧАТЬ</a>
  </section>

  <details class="win log">
    <summary class="wt">[ ЛОГ FFMPEG ]</summary>
    <pre id="log"></pre>
  </details>
  <div class="spacer"></div>
</main>
<div class="dock"><button id="go" class="btn go" disabled>&gt; УХУДШИТЬ<span class="cur">_</span></button></div>
<script type="module" src="app.js"></script>
</body>
</html>
